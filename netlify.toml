# Netlify builds the site from GitHub on every push.
# main = live site; pull requests get a private Deploy Preview first.
[build]
  command = "pnpm run build:static"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"

# No catch-all redirect: the site is a single page, so unknown addresses
# (e.g. bots probing /wp-login.php) get the real 404.html with a 404 status.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
